name: Splendor checks and Pages

on:
  push:
    branches: [main]
    paths: &site-paths
      - 'src/**'
      - 'test/**'
      - 'lib/**'
      - 'scripts/**'
      - 'site/**'
      - 'index.html'
      - 'README.md'
      - 'compile.*'
      - 'generate_docs_enhanced.*'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/splendor-tests.yml'
  pull_request:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splendor-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/splendor-tests.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the guide and current API documentation
        run: python3 scripts/build_site.py --output '${{ runner.temp }}/splendor-site'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '${{ runner.temp }}/splendor-site'
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
