name: Splendor tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'test/**', '.github/workflows/splendor-tests.yml']
  push:
    branches: [main]
    paths: ['src/**', 'test/**', '.github/workflows/splendor-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splendor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: 'Splendor workspace'
      - name: Check Bash argument handling with synthetic Java tools
        working-directory: 'Splendor workspace'
        run: python3 test/runner_shell_checks.py -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: 'Splendor workspace'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check real compilation and formatter in a path with spaces
        working-directory: 'Splendor workspace'
        shell: cmd
        run: test\run_tests.bat --class com.splendor.util.MoveFormatterTest
