name: Splendor tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: 'Splendor workspace'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Bash argument handling with synthetic Java tools
        if: runner.os == 'Linux'
        working-directory: 'Splendor workspace'
        run: python3 test/runner_shell_checks.py -v
      - name: Run the full non-network suite on Linux
        if: runner.os == 'Linux'
        working-directory: 'Splendor workspace'
        run: bash test/run_tests.sh
      - name: Check documentation CSS asset validation
        if: runner.os == 'Linux'
        working-directory: 'Splendor workspace'
        run: python3 test/site_builder_checks.py -v
      - name: Run the full non-network suite on Windows
        if: runner.os == 'Windows'
        working-directory: 'Splendor workspace'
        shell: cmd
        run: test\run_tests.bat
